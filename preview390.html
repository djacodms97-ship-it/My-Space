<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390 preview</title>
<style>
  html,body{margin:0;background:#0b0c0f;display:flex;gap:16px;padding:8px;align-items:flex-start}
  iframe{width:390px;height:844px;border:1px solid #2a2f38;border-radius:8px;background:#111317}
</style>
</head>
<body>
<iframe id="a" title="list"></iframe>
<iframe id="b" title="month"></iframe>
<script>
  var t = Date.now();
  function prep(f, month) {
    var d = f.contentDocument;
    if (!d) return;
    var s = d.createElement('style');
    s.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}';
    d.head.appendChild(s);
    if (month) { var b = d.getElementById('btnViewMonth'); if (b) b.click(); }
  }
  var a = document.getElementById('a'), b = document.getElementById('b');
  a.src = './index.html?pv=list&t=' + t;
  b.src = './index.html?pv=month&t=' + t;
  a.addEventListener('load', function () { prep(this, false); });
  b.addEventListener('load', function () { prep(this, true); });
</script>
</body>
</html>
