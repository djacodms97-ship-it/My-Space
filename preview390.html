<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390 preview</title>
<style>
  html,body{margin:0;background:#0b0c0f;display:flex;gap:16px;padding:8px;align-items:flex-start}
  iframe{width:390px;height:844px;border:1px solid #2a2f38;border-radius:8px;background:#111317}
</style>
</head>
<body>
<iframe id="a" src="./index.html?pv=list" title="list"></iframe>
<iframe id="b" src="./index.html?pv=month" title="month"></iframe>
<script>
  // 두 번째 프레임은 먼슬리 보기로 바로 연다.
  document.getElementById('b').addEventListener('load', function () {
    var d = this.contentDocument;
    var btn = d && d.getElementById('btnViewMonth');
    if (btn) btn.click();
  });
</script>
</body>
</html>
